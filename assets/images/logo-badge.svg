<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a361e"/>
      <stop offset="25%" stop-color="#2d2011"/>
      <stop offset="50%" stop-color="#543e22"/>
      <stop offset="75%" stop-color="#2d2011"/>
      <stop offset="100%" stop-color="#3d2a14"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="30%" stop-color="#b8860b"/>
      <stop offset="70%" stop-color="#e6ca65"/>
      <stop offset="100%" stop-color="#8a5a08"/>
    </linearGradient>
    <linearGradient id="goldText" x1="10" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="40%" stop-color="#dfb755"/>
      <stop offset="80%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#694306"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Base Square with Subtle Rounded Corners -->
  <rect width="48" height="48" rx="6" fill="url(#bronzeGrad)"/>
  <!-- Metallic Border -->
  <rect x="2" y="2" width="44" height="44" rx="4" stroke="url(#goldBorder)" stroke-width="1.8" fill="none"/>
  <!-- Inner Border Line -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="2.5" stroke="#1f150a" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- Embossed SS Typography -->
  <text x="24" y="32" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="24" fill="url(#goldText)" text-anchor="middle" letter-spacing="1.5" filter="url(#emboss)">SS</text>
</svg>
